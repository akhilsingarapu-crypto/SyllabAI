<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SyllabAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="layout">

    <!-- LEFT: your notes -->
    <aside class="shelf">
      <h1 class="brand">Syllab<mark>AI</mark></h1>

      <div class="shelf-head">
        <h2 class="shelf-title">Chats</h2>
        <button type="button" id="new-chat" class="new-chat">+ New chat</button>
      </div>
      <ul class="chat-list" id="chat-list" aria-label="Your chats"></ul>

      <label class="dropzone" id="dropzone" for="file-input">
        <strong>Add your notes</strong>
        <span>Drop a PDF, .txt or photo of notes here, or click to choose</span>
        <input type="file" id="file-input" accept=".pdf,.txt,.png,.jpg,.jpeg" multiple hidden>
      </label>

      <h2 class="shelf-title">Your notes</h2>
      <ul class="file-list" id="file-list">
        <li class="empty">No notes yet. Add one to get started.</li>
      </ul>
    </aside>

    <!-- RIGHT: the chat -->
    <main class="chat">
      <div class="messages" id="messages" aria-live="polite">
        <div class="msg bot">
          <p>Hi! Add your notes on the left, then ask me anything about them.</p>
        </div>
      </div>

      <div class="toolbar">
        <label class="scope-label">Ask in
          <select id="scope" aria-label="Which notes to use">
            <option value="">All notes</option>
          </select>
        </label>
        <button type="button" data-study="summary">Summarize</button>
        <button type="button" data-study="quiz">Quiz me</button>
        <button type="button" data-study="flashcards">Flashcards</button>
        <button type="button" id="export-chat" class="ghost">Save chat</button>
        <button type="button" id="clear-chat" class="ghost">Clear chat</button>
      </div>

      <form class="composer" id="chat-form">
        <button type="button" class="icon-btn" id="attach" title="Add notes (PDF, .txt or photo)" aria-label="Add notes">📎</button>
        <input type="file" id="attach-input" accept=".pdf,.txt,.png,.jpg,.jpeg" multiple hidden>
        <textarea id="question" rows="1" placeholder="Ask about your notes…" aria-label="Your question" required></textarea>
        <button type="button" class="icon-btn" id="mic" title="Speak your question" aria-label="Speak your question" aria-pressed="false">🎤</button>
        <button type="submit" id="send">Ask</button>
      </form>
    </main>

  </div>
  <!-- Password box: hidden unless the server asks for a password -->
  <div class="login" id="login" hidden>
    <form id="login-form">
      <h2>Enter password</h2>
      <input type="password" id="login-key" aria-label="Password" autocomplete="current-password" required>
      <button type="submit">Open</button>
      <p class="login-error" id="login-error" role="alert"></p>
    </form>
  </div>
  <script src="app.js"></script>
</body>
</html>
