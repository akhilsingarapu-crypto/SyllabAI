# Render Blueprint: one web service that serves both the API and the page.
# A persistent disk needs a paid plan (starter). On the free plan delete the `disk:` block and
# set plan: free, but uploaded notes are then lost whenever the service restarts or redeploys.
services:
  - type: web
    name: syllabai
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DEBUG
        value: "0"
      - key: DATA_DIR
        value: /var/data
      - key: GROQ_API_KEY
        sync: false        # you type this in the Render dashboard; it is never stored in git
      - key: APP_URL
        sync: false        # your site's https address, used in password-reset emails
      - key: SMTP_HOST
        sync: false        # e.g. smtp.gmail.com (optional; without it reset links go to the logs)
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SIGNUP_CODE
        sync: false        # invite code new users must enter (recommended)
      - key: DAILY_LIMIT
        value: "150"
      - key: MAX_USER_MB
        value: "200"
      - key: ALLOW_SIGNUP
        value: "1"         # set to 0 to close registration
    disk:
      name: notes
      mountPath: /var/data
      sizeGB: 1
